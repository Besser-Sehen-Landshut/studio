name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Committed bundle matches source
        run: |
          pnpm bundle
          # porcelain also lists new untracked files, which git diff would miss
          test -z "$(git status --porcelain -- dist-bundle)" || { git status --porcelain -- dist-bundle; exit 1; }
      # The proof sandbox tests run commands in bubblewrap, as Studio does on Linux. Ubuntu
      # restricts unprivileged user namespaces by AppArmor, which bubblewrap needs.
      - name: Sandbox for proof commands
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --unshare-all --ro-bind / / /bin/true
      - run: pnpm test
        env:
          STUDIO_PRIVATE_WORDS: ${{ secrets.STUDIO_PRIVATE_WORDS }}
          # Fork pull requests get no secrets; only then may the word list be empty.
          STUDIO_PRIVATE_WORDS_OPTIONAL: ${{ github.event.pull_request.head.repo.fork == true && '1' || '' }}

  # The Windows crew sandbox of workers (src/windows-sandbox.ts) on a real Windows machine. The
  # GitHub-hosted runner is elevated, so the test creates its crew users, their group and firewall
  # rule there. One test file at a time: they make and delete users and set ACLs elevated.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The release tags: the bootstrap test builds the assets of one.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Windows crew sandbox
        run: pnpm exec vitest run --no-file-parallelism test/egress-proxy.test.ts test/windows-sandbox.test.ts test/windows-real.test.ts test/relay-windows-real.test.ts test/relay-uninstall.test.ts test/relay-lockdown.test.ts test/relay-bootstrap.test.ts test/relay-deny-sync.test.ts
        env:
          STUDIO_WINDOWS_SANDBOX_TEST: "1"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact -v /repo
